<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>圖片管理 - MapIt 後台</title>
    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="MapIt 旅遊平台 - 後台管理系統" />
    <meta name="author" content="TKA101G1" />
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/styles.css" rel="stylesheet" />
    
    <style>
        .image-card {
            position: relative;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .image-card .card-body {
            padding: 10px;
        }
        .main-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }
        .upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background-color: #f8f9fa;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #0d6efd;
            background-color: #e7f1ff;
        }
    </style>
</head>
<body>
    <!-- 引入共用後台導覽列片段 -->
    <header th:replace="~{layouts/backend :: backendHeader}"></header>

    <!-- ========== 主要內容區 ========== -->
    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <!-- 頁面標題 -->
            <div class="row mb-4">
                <div class="col-12">
                    <h2 class="fw-bolder">
                        <i class="bi bi-images"></i> 圖片管理
                    </h2>
                    <p class="text-muted">管理景點圖片 (景點 ID: <span th:text="${attrId}">1</span> - <span th:text="${attrName}">景點名稱</span>)</p>
                </div>
            </div>

            <!-- 成功/失敗訊息 -->
            <div class="row mb-3" th:if="${successMessage}">
                <div class="col-12">
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}">操作成功</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                </div>
            </div>
            <div class="row mb-3" th:if="${errorMessage}">
                <div class="col-12">
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}">操作失敗</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                </div>
            </div>

            <!-- 返回按鈕 -->
            <div class="row mb-3">
                <div class="col-12">
                    <a href="/attr/listAll" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> 返回景點列表
                    </a>
                </div>
            </div>

            <!-- 上傳表單區 -->
            <div class="row mb-5">
                <!-- 上傳本地圖片 -->
                <div class="col-12 col-lg-6 mb-3 mb-lg-0">
                    <div class="card h-100">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="bi bi-cloud-upload"></i> 上傳本地圖片</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/attr/image/upload}" method="post" enctype="multipart/form-data">
                                <input type="hidden" name="attrId" th:value="${attrId}" />
                                
                                <div class="upload-area mb-3">
                                    <i class="bi bi-cloud-arrow-up" style="font-size: 3rem; color: #6c757d;"></i>
                                    <h5 class="mt-3">選擇要上傳的圖片</h5>
                                    <p class="text-muted">支援 JPG、PNG、GIF 格式，可一次選擇多張圖片</p>
                                    <input type="file" 
                                           name="files" 
                                           id="fileInput"
                                           class="form-control mt-3" 
                                           multiple 
                                           accept="image/*" 
                                           required />
                                </div>
                                
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary btn-lg">
                                        <i class="bi bi-upload"></i> 開始上傳
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- 透過 URL 新增圖片 -->
                <div class="col-12 col-lg-6">
                    <div class="card h-100">
                        <div class="card-header bg-success text-white">
                            <h5 class="mb-0"><i class="bi bi-link-45deg"></i> 透過 URL 新增圖片</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/attr/image/uploadByUrl}" method="post">
                                <input type="hidden" name="attrId" th:value="${attrId}" />
                                
                                <div class="mb-3">
                                    <label for="imageUrl" class="form-label">
                                        <i class="bi bi-globe"></i> 圖片 URL
                                    </label>
                                    <input type="url" 
                                           class="form-control" 
                                           id="imageUrl" 
                                           name="imageUrl" 
                                           placeholder="https://example.com/image.jpg" 
                                           required />
                                    <div class="form-text">請輸入完整的圖片網址（包含 http:// 或 https://）</div>
                                </div>
                                
                                <div class="mb-3 form-check">
                                    <input type="checkbox" 
                                           class="form-check-input" 
                                           id="isMainUrl" 
                                           name="isMain" 
                                           value="true" />
                                    <label class="form-check-label" for="isMainUrl">
                                        <i class="bi bi-star"></i> 設為主圖
                                    </label>
                                </div>
                                
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-success btn-lg">
                                        <i class="bi bi-plus-circle"></i> 新增圖片
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 圖片列表區 -->
            <div class="row mb-4">
                <div class="col-12">
                    <h4 class="fw-bold">
                        <i class="bi bi-collection"></i> 圖片列表
                        <span class="badge bg-secondary" th:text="${#lists.size(images)}">0</span>
                    </h4>
                </div>
            </div>

            <!-- 圖片網格顯示 -->
            <div class="row g-4">
                <!-- 使用 Thymeleaf th:each 迴圈渲染圖片 -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-3" th:each="image : ${images}">
                    <div class="image-card">
                        <!-- 主圖標籤 -->
                        <span th:if="${image.isMain}" class="badge bg-danger main-badge">
                            <i class="bi bi-star-fill"></i> 主圖
                        </span>
                        
                        <!-- 圖片 (優先使用 imageUrl，若無則使用 imagePath，並加上 onerror 防呆) -->
                        <img th:src="${image.imageUrl != null && !#strings.isEmpty(image.imageUrl)} ? ${image.imageUrl} : @{/attraction_images/{path}(path=${image.imagePath != null ? image.imagePath : 'default.jpg'})}" 
                             th:alt="${image.imagePath}"
                             onerror="this.onerror=null; this.src='/attraction_images/default.jpg';"
                             class="img-fluid" />
                        
                        <!-- 操作按鈕 -->
                        <div class="card-body">
                            <div class="d-grid gap-2">
                                <!-- 設為主圖按鈕 (非主圖時顯示) -->
                                <a th:unless="${image.isMain}"
                                   th:href="@{/attr/image/setMain/{id}(id=${image.imageId}, attrId=${attrId})}"
                                   class="btn btn-sm btn-warning">
                                    <i class="bi bi-star"></i> 設為主圖
                                </a>
                                
                                <!-- 已是主圖時顯示 -->
                                <button th:if="${image.isMain}" 
                                        class="btn btn-sm btn-success" 
                                        disabled>
                                    <i class="bi bi-check-circle"></i> 目前主圖
                                </button>
                                
                                <!-- 刪除按鈕 -->
                                <a th:href="@{/attr/image/delete/{id}(id=${image.imageId}, attrId=${attrId})}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('確定要刪除此圖片嗎？刪除後將無法復原。');">
                                    <i class="bi bi-trash"></i> 刪除
                                </a>
                            </div>
                            
                            <!-- 上傳時間 -->
                            <div class="mt-2 text-center">
                                <small class="text-muted">
                                    <i class="bi bi-clock"></i>
                                    <span th:text="${#temporals.format(image.uploadTime, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 若無圖片時顯示提示訊息 -->
                <div class="col-12" th:if="${#lists.isEmpty(images)}">
                    <div class="text-center py-5">
                        <i class="bi bi-image" style="font-size: 4rem; color: #dee2e6;"></i>
                        <h4 class="mt-3 text-muted">尚無圖片</h4>
                        <p class="text-muted">請使用上方的上傳表單新增圖片</p>
                    </div>
                </div>
            </div>

            <!-- 統計資訊 -->
            <div class="row mt-4">
                <div class="col-12">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> 
                        共有 <strong th:text="${#lists.size(images)}">0</strong> 張圖片
                        <span th:if="${#lists.size(images) > 0}">
                            | 主圖: <strong th:text="${#lists.size(images.?[isMain == true])}">0</strong> 張
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer class="py-5 bg-dark">
        <div class="container"><p class="m-0 text-center text-white">Copyright &copy; MapIt 2026 - TKA101G1</p></div>
    </footer>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="/js/scripts.js"></script>
    
    <!-- 自訂 JavaScript -->
    <script>
        // 檔案選擇預覽功能
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                console.log('已選擇 ' + files.length + ' 個檔案');
            }
        });
    </script>
</body>
</html>
