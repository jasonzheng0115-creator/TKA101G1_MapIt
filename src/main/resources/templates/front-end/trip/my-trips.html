<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="MapIt 我的行程" />
    <meta name="author" content="TKA101G1" />
    <title>我的行程 - MapIt</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />

    <!-- 引入 Google Fonts (Outfit & Noto Sans TC) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: #f8fafc;
            color: #334155;
            padding-top: 140px;
            /* 避免固定雙導覽列遮擋內容 */
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }


        /* 橘色調按鈕（對齊首頁橘色風格） */
        .btn-orange {
            background-color: #ff5722;
            color: #ffffff;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-orange:hover {
            background-color: #e64a19;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
        }

        /* 網格行程卡片美化 */
        .trip-grid-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            background: #ffffff;
            text-decoration: none;
        }

        .trip-grid-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
        }

        .card-zoom-effect {
            transition: transform 0.5s ease;
            object-fit: cover;
        }

        .trip-grid-card:hover .card-zoom-effect {
            transform: scale(1.06);
        }

        /* 頭像堆疊效果 */
        .avatar-group {
            display: flex;
            align-items: center;
        }

        .avatar-group .avatar-item {
            margin-left: -6px;
            z-index: 1;
            transition: all 0.2s;
        }

        .avatar-group .avatar-item:hover {
            transform: scale(1.15);
            z-index: 10;
        }

        /* 舒適空狀態 */
        .empty-msg {
            background-color: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            padding: 70px 40px;
            text-align: center;
            color: #64748b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.02);
        }

        .hover-orange {
            transition: color 0.2s;
        }

        .hover-orange:hover {
            color: #ff5722 !important;
        }

        .card-click-link {
            display: block;
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>

<body>

    <!-- 引入共用前台導覽列 -->
    <header th:replace="~{layouts/frontend :: navbar}"></header>

    <!-- 主要內容區 -->
    <main class="container px-4 px-lg-5 mt-4">

        <!-- 頁面頂部控制列 (對齊設計圖與首頁風格) -->
        <div class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom">
            <h2 class="fw-bold m-0" style="font-family: 'Noto Sans TC', sans-serif; font-size: 2.2rem; color: #212529;">
                我的行程</h2>
            <a th:href="@{/trip/create}"
                class="btn btn-orange rounded-pill px-4 py-2 fw-bold shadow-sm d-flex align-items-center gap-2">
                <i class="bi bi-plus-circle-fill"></i> 建立新行程
            </a>
        </div>

        <!-- 情況 A：無行程紀錄時 -->
        <div th:if="${#lists.isEmpty(tripList)}" class="empty-msg my-5">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light mb-3"
                style="width: 80px; height: 80px;">
                <i class="bi bi-compass text-muted" style="font-size: 2.2rem;"></i>
            </div>
            <h4 class="fw-bold text-dark mb-2">踏出探索世界的第一步！</h4>
            <p class="text-secondary mb-4 col-md-8 mx-auto">您目前還沒有建立任何行程。現在就來新增您的第一筆自由行，探索台灣各大美景吧！</p>
            <a th:href="@{/trip/create}" class="btn btn-orange rounded-pill px-4 fw-bold">
                <i class="bi bi-plus-circle"></i> 建立行程
            </a>
        </div>

        <!-- 情況 B：行程卡片清單 (對齊設計圖三欄 Grid) -->
        <div class="row row-cols-1 row-cols-md-3 g-4" th:unless="${#lists.isEmpty(tripList)}">
            <div class="col" th:each="trip : ${tripList}">
                <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden position-relative trip-grid-card">

                    <!-- 行程點擊區區塊 (點擊此區塊皆能進入編輯) -->
                    <a th:href="@{'/trip/edit/' + ${trip.tripId}}" class="card-click-link">
                        <!-- 卡片上層圖片 -->
                        <div class="position-relative overflow-hidden" style="height: 180px;">
                            <!-- 使用 Picsum 動態生成風景照 -->
                            <img th:src="'https://picsum.photos/seed/' + ${trip.tripId} + '/600/400'" alt="行程封面"
                                class="w-100 h-100 card-zoom-effect">
                        </div>

                        <!-- 下層文字資訊 -->
                        <div class="card-body p-3 bg-white">
                            <h5 class="card-title fw-bold text-dark mb-1" th:text="${trip.tripName}"
                                style="font-size: 1.05rem; font-family: 'Noto Sans TC', sans-serif;">行程名稱</h5>
                            <p class="card-text text-secondary small mb-0">
                                <i class="bi bi-calendar-event text-orange me-1"></i>
                                <span th:text="${trip.tripDate}">2026-06-01</span>
                            </p>
                        </div>
                    </a>

                    <!-- 浮動頭像與三點選單 (置於 absolute 層級，避免干擾整卡點擊) -->
                    <div class="position-absolute"
                        style="top: 12px; right: 12px; z-index: 5; display: flex; align-items: center; gap: 8px;">
                        <!-- 頭像群組 -->
                        <div class="avatar-group d-flex align-items-center">

                            <!-- 擁有者頭像區塊 -->
                            <div class="avatar-item" style="position: relative; width: 28px; height: 28px;">
                                <!-- 優先載入圖片頭像 (資料庫有頭像時顯示) -->
                                <img th:if="${trip.custVO.custImg != null && !#strings.isEmpty(trip.custVO.custImg)}"
                                    th:src="@{'/customer/avatar/' + ${trip.custVO.custId}}"
                                    class="rounded-circle border border-2 border-white shadow-sm"
                                    style="width: 28px; height: 28px; object-fit: cover;">
                                <!-- 文字首字頭像 (當資料庫無頭像時顯示) -->
                                <div th:if="${trip.custVO.custImg == null || #strings.isEmpty(trip.custVO.custImg)}"
                                    class="rounded-circle border border-2 border-white d-flex align-items-center justify-content-center text-white fw-bold shadow-sm"
                                    th:style="'width: 28px; height: 28px; font-size: 11px; background-color: #ff5722;'"
                                    th:text="${trip.custVO.custName != null && !#strings.isEmpty(trip.custVO.custName) ? #strings.substring(trip.custVO.custName, 0, 1) : '👤'}">
                                    森
                                </div>
                            </div>

                            <!-- 協作者頭像區塊 -->
                            <th:block th:each="collab : ${trip.collaborators}">
                                <div class="avatar-item" style="position: relative; width: 28px; height: 28px;">
                                    <!-- 優先載入圖片頭像 (資料庫有頭像時顯示) -->
                                    <img th:if="${collab.custImg != null && !#strings.isEmpty(collab.custImg)}"
                                        th:src="@{'/customer/avatar/' + ${collab.custId}}"
                                        class="rounded-circle border border-2 border-white shadow-sm"
                                        style="width: 28px; height: 28px; object-fit: cover;">
                                    <!-- 文字首字頭像 (當資料庫無頭像時顯示) -->
                                    <div th:if="${collab.custImg == null || #strings.isEmpty(collab.custImg)}"
                                        class="rounded-circle border border-2 border-white d-flex align-items-center justify-content-center text-white fw-bold shadow-sm"
                                        th:style="'width: 28px; height: 28px; font-size: 11px; background-color: #ffb300;'"
                                        th:text="${collab.custName != null && !#strings.isEmpty(collab.custName) ? #strings.substring(collab.custName, 0, 1) : '👤'}">
                                        友
                                    </div>
                                </div>
                            </th:block>
                        </div>

                        <!-- 三點控制下拉選單 -->
                        <div class="dropdown">
                            <button
                                class="btn btn-light rounded-circle shadow-sm p-0 d-flex align-items-center justify-content-center border-0"
                                style="width: 28px; height: 28px; background: rgba(255,255,255,0.9);" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-three-dots text-dark" style="font-size: 14px;"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow border-0 py-2"
                                style="border-radius: 12px; font-size: 13px;">
                                <li>
                                    <a class="dropdown-item py-2 fw-bold text-dark"
                                        th:href="@{'/trip/edit/' + ${trip.tripId}}">
                                        <i class="bi bi-pencil-square me-2 text-primary"></i> 編輯行程
                                    </a>
                                </li>
                                <li class="dropdown-divider m-1"></li>
                                <li>
                                    <!-- 刪除行程 Form -->
                                    <form th:if="${trip.custVO.custId == loginCustId}" th:action="@{/trip/delete}"
                                        method="post" class="m-0" onsubmit="return confirm('確定要完全刪除這個行程嗎？此動作將無法復原！');">
                                        <input type="hidden" name="tripId" th:value="${trip.tripId}" />
                                        <button type="submit" class="dropdown-item py-2 fw-bold text-danger">
                                            <i class="bi bi-trash-fill me-2"></i> 刪除行程
                                        </button>
                                    </form>
                                    <!-- 退出協作 Form -->
                                    <form th:unless="${trip.custVO.custId == loginCustId}"
                                        th:action="@{/trip/exit-collab}" method="post" class="m-0"
                                        onsubmit="return confirm('確定要退出這個行程協作嗎？');">
                                        <input type="hidden" name="tripId" th:value="${trip.tripId}" />
                                        <button type="submit" class="dropdown-item py-2 fw-bold text-warning">
                                            <i class="bi bi-box-arrow-right me-2"></i> 退出行程
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- 引入共用前台 JavaScript 腳本 -->
    <th:block th:replace="~{layouts/frontend :: scripts}"></th:block>
</body>

</html>
