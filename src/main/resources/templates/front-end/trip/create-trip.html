<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="MapIt 新增行程" />
    <meta name="author" content="TKA101G1" />
    <title>規劃新旅程 - MapIt</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />

    <!-- 引入 Google Fonts (Outfit & Noto Sans TC) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(255, 245, 240, 0.8) 0%, rgba(243, 244, 246, 0.6) 90%);
            color: #1e293b;
            padding-top: 140px;
            /* 預留頂部雙導覽列的高度 */
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 夢幻氣泡背景裝飾 */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: pulse 12s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: rgba(255, 87, 34, 0.15);
            top: 10%;
            left: -100px;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background: rgba(255, 179, 0, 0.12);
            bottom: 10%;
            right: -100px;
            animation-delay: -3s;
        }

        @keyframes pulse {
            0% {
                transform: scale(1) translate(0px, 0px);
            }

            100% {
                transform: scale(1.15) translate(30px, 20px);
            }
        }


        /* 莫蘭迪玻璃卡片樣式 */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(255, 87, 34, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 25px 30px -5px rgba(255, 87, 34, 0.08), 0 12px 15px -5px rgba(0, 0, 0, 0.04);
        }

        /* 標題與漸層字 */
        .text-gradient {
            background: linear-gradient(135deg, #ff7e5f 0%, #ff5722 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* 自訂輸入框 */
        .form-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .custom-input {
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            background-color: rgba(255, 255, 255, 0.7);
        }

        .custom-input:focus {
            border-color: #ff5722;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.15);
        }

        /* 漸層按鈕 */
        .btn-gradient {
            background: linear-gradient(135deg, #ff7e5f 0%, #ff5722 100%);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(255, 87, 34, 0.3);
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 87, 34, 0.4);
            color: #ffffff;
        }

        .btn-gradient:active {
            transform: translateY(0);
        }

        .icon-box-gradient {
            background: linear-gradient(135deg, rgba(255, 126, 95, 0.1) 0%, rgba(255, 87, 34, 0.1) 100%);
            color: #ff5722;
            width: 76px;
            height: 76px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
        }

        .hover-orange {
            transition: color 0.2s;
        }

        .hover-orange:hover {
            color: #ff5722 !important;
        }

    </style>
</head>

<body>

    <!-- 夢幻背景氣泡 -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <!-- 引入共用前台導覽列 -->
    <header th:replace="~{layouts/frontend :: navbar}"></header>

    <!-- 主要內容區 -->
    <main class="container px-4 px-lg-5 mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card glass-card p-4 p-md-5 border-0">

                    <!-- 標題設計 -->
                    <div class="text-center mb-4">
                        <div class="icon-box-gradient mb-3 shadow-sm">
                            <i class="bi bi-compass-fill" style="font-size: 2.2rem;"></i>
                        </div>
                        <h2 class="fw-bold text-gradient">規劃新旅程</h2>
                        <p class="text-secondary small mt-1">填寫您的目的地，開啟專屬您的精彩假期</p>
                    </div>

                    <!-- 行程建立表單 -->
                    <form th:action="@{/trip/create}" th:object="${trip}" method="post">
                        <!-- 行程名稱 -->
                        <div class="mb-4">
                            <label for="tripName" class="form-label mb-2 d-flex align-items-center gap-1">
                                <i class="bi bi-tag-fill text-orange"></i> 行程名稱
                            </label>
                            <input type="text" id="tripName" th:field="*{tripName}"
                                class="form-control custom-input border" placeholder="例如：澎湖3天兩夜花火節" required>
                        </div>

                        <!-- 出發日期 -->
                        <div class="mb-4">
                            <label for="tripDate" class="form-label mb-2 d-flex align-items-center gap-1">
                                <i class="bi bi-calendar2-week-fill text-orange"></i> 出發日期
                            </label>
                            <input type="date" id="tripDate" th:field="*{tripDate}"
                                class="form-control custom-input border" required>
                        </div>

                        <!-- 送出 -->
                        <button type="submit"
                            class="btn btn-gradient w-100 py-3 d-flex align-items-center justify-content-center gap-2 shadow fs-6">
                            開始規劃景點 <i class="bi bi-arrow-right-short fs-4"></i>
                        </button>
                    </form>

                    <!-- 取消回行程清單 -->
                    <div class="text-center mt-4">
                        <a th:href="@{/trip/my-trips}"
                            class="text-secondary small text-decoration-none hover-orange fw-bold d-inline-flex align-items-center gap-1">
                            <i class="bi bi-arrow-left-short fs-5 align-middle"></i> 取消，回我的行程
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 引入共用前台 JavaScript 腳本 -->
    <th:block th:replace="~{layouts/frontend :: scripts}"></th:block>
</body>

</html>
