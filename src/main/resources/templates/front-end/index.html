<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{layouts/frontend :: head}"></th:block>
    <title>MapIt - 旅遊景點平台</title>
    <style>
        /* 專屬置中 Banner 輪播樣式 */
        .hero-banner-carousel {
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .banner-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .banner-slide {
            flex: 0 0 65%; /* 輪播寬度，兩側各保留約 17.5% 作為相鄰卡片露出空間 */
            height: 400px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            transform: scale(0.9);
            opacity: 0.5;
            transition: transform 0.5s ease, opacity 0.5s ease;
            margin: 0 10px;
        }

        @media (max-width: 768px) {
            .banner-slide {
                flex: 0 0 85%; /* 手機版寬度佔滿 85% */
                height: 250px;
            }
        }

        .banner-slide.active {
            transform: scale(1);
            opacity: 1;
            z-index: 2;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.7));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-title {
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            font-size: 2.5rem;
            font-weight: 800;
        }

        @media (max-width: 768px) {
            .banner-title {
                font-size: 1.8rem;
            }
        }

        /* 指示點 */
        .banner-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .banner-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background-color: #ccc;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .banner-dot.active {
            background-color: #ff5722;
            width: 25px; /* 主動點變為長橢圓 */
            border-radius: 5px;
        }

        /* 搜尋框本體樣式優化 */
        .hero-search-bar {
            background: #ffffff;
            border-radius: 50px;
            padding: 8px 8px 8px 24px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15) !important;
            border: 1px solid rgba(0,0,0,0.05);
            width: 100%;
        }

        .hero-search-bar input {
            border: none;
            background: transparent;
            font-size: 1.1rem;
            flex-grow: 1;
            color: #333;
        }

        .hero-search-bar input:focus {
            outline: none;
        }

        .hero-search-bar .btn {
            border-radius: 50px;
            padding: 12px 35px;
            font-weight: bold;
            font-size: 1.1rem;
            background-color: #ff5722 !important; /* 與主視覺一致的亮橘色 */
            border: none;
            transition: background-color 0.2s;
        }

        .hero-search-bar .btn:hover {
            background-color: #e04818 !important;
        }
    </style>
</head>

    <!-- 引用共用的前台 scripts -->
    <th:block th:replace="~{layouts/frontend :: scripts}"></th:block>
    <script>
        let activeBannerIndex = 0;
        let autoplayTimer = null;
        const MAX_DOTS = 8; // 限制指示點最大數量為 8 個

        function setupBannerCarousel() {
            const track = document.getElementById('bannerTrack');
            const slides = document.querySelectorAll('.banner-slide');
            const dotsContainer = document.getElementById('bannerDots');
            
            if (!track || slides.length === 0) return;
            
            // 1. 動態產生 Dots (最多 MAX_DOTS 個)
            dotsContainer.innerHTML = '';
            const totalDots = Math.min(slides.length, MAX_DOTS);
            for (let idx = 0; idx < totalDots; idx++) {
                const dot = document.createElement('div');
                dot.className = `banner-dot ${idx === 0 ? 'active' : ''}`;
                dot.addEventListener('click', () => {
                    // 點擊第 idx 個 dot 時，跳轉到最接近當前循環的目標投影片
                    const currentCycle = Math.floor(activeBannerIndex / totalDots);
                    const targetIndex = currentCycle * totalDots + idx;
                    if (targetIndex < slides.length) {
                        jumpToBanner(targetIndex);
                    } else {
                        jumpToBanner(idx); // 超出總數則回到首輪
                    }
                    resetAutoplay();
                });
                dotsContainer.appendChild(dot);
            }
            
            // 2. 初始定位
            updateBannerPosition();
            
            // 3. 啟動自動輪播 (每 4 秒切換一次)
            startAutoplay();
            
            // 4. 監聽視窗重置大小 (確保 RWD 置中無誤)
            window.addEventListener('resize', updateBannerPosition);
        }

        function startAutoplay() {
            autoplayTimer = setInterval(() => {
                moveBanner(1);
            }, 4000);
        }

        function resetAutoplay() {
            if (autoplayTimer) {
                clearInterval(autoplayTimer);
            }
            startAutoplay();
        }

        function updateBannerPosition() {
            const track = document.getElementById('bannerTrack');
            const slides = document.querySelectorAll('.banner-slide');
            const dots = document.querySelectorAll('.banner-dot');
            
            if (!track || slides.length === 0) return;
            
            const trackWidth = track.parentElement.offsetWidth;
            const slideEl = slides[activeBannerIndex];
            const slideWidth = slideEl.offsetWidth;
            
            // 取得軌道 gap / margin 設定
            const slideStyle = window.getComputedStyle(slideEl);
            const marginLeft = parseFloat(slideStyle.marginLeft) || 0;
            const marginRight = parseFloat(slideStyle.marginRight) || 0;
            const slideFullWidth = slideWidth + marginLeft + marginRight;
            
            // 計算置中偏移量公式
            const centerOffset = (trackWidth - slideWidth) / 2 - (activeBannerIndex * slideFullWidth) - marginLeft;
            
            track.style.transform = `translateX(${centerOffset}px)`;
            
            // 更新 Active Class
            slides.forEach((slide, idx) => {
                if (idx === activeBannerIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });
            
            // 更新 Dots Active Class (採用取餘數循環機制)
            if (dots.length > 0) {
                const activeDotIndex = activeBannerIndex % dots.length;
                dots.forEach((dot, idx) => {
                    if (idx === activeDotIndex) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }
        }

        function moveBanner(direction) {
            const slides = document.querySelectorAll('.banner-slide');
            if (slides.length === 0) return;
            
            activeBannerIndex = (activeBannerIndex + direction + slides.length) % slides.length;
            updateBannerPosition();
        }

        function jumpToBanner(index) {
            activeBannerIndex = index;
            updateBannerPosition();
        }

       function scrollSwimlane(containerId, direction) {
           const container = document.getElementById(containerId);
           if (container) {
               // 每次點擊滾動大約一個卡片的寬度加上間距
               const scrollAmount = 300;
               container.scrollBy({
                   left: direction * scrollAmount,
                   behavior: 'smooth'
               });
           }
       }
       function addToFavorite(attrId) {
           if (!attrId) return;
           fetch('/front/favorite/add', {
               method: 'POST',
               headers: {
                   'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'attrId=' + attrId
            })
                .then(response => {
                    if (response.ok) {
                        alert('成功加入收藏！');
                    } else {
                        alert('加入收藏失敗，請稍後再試。');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }
        // 縣市篩選、顯示與前端分頁邏輯
        document.addEventListener('DOMContentLoaded', function () {
            setupBannerCarousel();
            const regionLinks = document.querySelectorAll('.region-pills .nav-link');
            const attractionItems = Array.from(document.querySelectorAll('.attraction-item'));
            const countyContainer = document.getElementById('countyPillsContainer');
            const paginationContainer = document.getElementById('gridPagination');
            const pageInfo = document.getElementById('gridPageInfo');
            const pageButtons = document.getElementById('gridPageButtons');
            const attrSection = document.getElementById('attrSection'); // 用於滾動定位
            
            const regionCountyMap = {
                '北部地區': ['基隆市', '台北市', '新北市', '桃園市', '新竹市', '新竹縣', '宜蘭縣'],
                '中部地區': ['苗栗縣', '台中市', '彰化縣', '南投縣', '雲林縣'],
                '南部地區': ['嘉義市', '嘉義縣', '台南市', '高雄市', '屏東縣'],
                '東部地區': ['花蓮縣', '台東縣'],
                '離島地區': ['澎湖縣', '金門縣', '連江縣']
            };

            const PAGE_SIZE = 12;      // 每頁顯示 12 筆
            let currentPage = 1;       // 當前頁碼
            let currentRegion = '全部'; // 當前選中地區
            let currentCounty = null;   // 當前選中縣市

            // 1. 初始化分頁與顯示
            filterAndPaginate();

            // 2. 一級地區 Pill 點擊事件
            regionLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    regionLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    
                    currentRegion = this.getAttribute('data-region');
                    currentCounty = null; // 重設二級篩選
                    currentPage = 1;      // 切換地區時回第一頁
                    
                    countyContainer.innerHTML = '';
                    if (currentRegion === '全部') {
                        countyContainer.classList.add('d-none');
                    } else {
                        countyContainer.classList.remove('d-none');
                        
                        // 生成「全部縣市」按鈕
                        const allCountyBtn = document.createElement('button');
                        allCountyBtn.className = 'btn btn-sm btn-dark px-3 rounded-pill me-2 mb-2';
                        allCountyBtn.innerText = '全部縣市';
                        allCountyBtn.addEventListener('click', function () {
                            setActiveCountyBtn(this);
                            currentCounty = null;
                            currentPage = 1;
                            filterAndPaginate();
                        });
                        countyContainer.appendChild(allCountyBtn);
                        
                        // 生成各縣市按鈕
                        const counties = regionCountyMap[currentRegion] || [];
                        counties.forEach(county => {
                            const btn = document.createElement('button');
                            btn.className = 'btn btn-sm btn-outline-secondary px-3 rounded-pill me-2 mb-2';
                            btn.innerText = county;
                            btn.addEventListener('click', function () {
                                setActiveCountyBtn(this);
                                currentCounty = county;
                                currentPage = 1;
                                filterAndPaginate();
                            });
                            countyContainer.appendChild(btn);
                        });
                    }
                    filterAndPaginate();
                });
            });

            function setActiveCountyBtn(activeBtn) {
                const buttons = countyContainer.querySelectorAll('button');
                buttons.forEach(btn => {
                    btn.classList.remove('btn-dark');
                    btn.classList.add('btn-outline-secondary');
                });
                activeBtn.classList.remove('btn-outline-secondary');
                activeBtn.classList.add('btn-dark');
            }

            // 3. 核心過濾與分頁渲染函數
            function filterAndPaginate() {
                // A. 依據條件過濾景點
                const filteredItems = attractionItems.filter(item => {
                    const itemRegion = item.getAttribute('data-region') || '';
                    const itemAddress = item.getAttribute('data-address') || '';
                    const normalizedItemRegion = itemRegion.replace(/臺/g, '台');
                    
                    // 檢查一級地區
                    let matchesRegion = false;
                    if (currentRegion === '全部') {
                        matchesRegion = true;
                    } else {
                        const countiesInRegion = (regionCountyMap[currentRegion] || []).map(c => c.replace(/臺/g, '台'));
                        matchesRegion = countiesInRegion.includes(normalizedItemRegion);
                    }
                    
                    // 檢查二級縣市
                    let matchesCounty = false;
                    if (!currentCounty) {
                        matchesCounty = true;
                    } else {
                        const normalizedCounty = currentCounty.replace(/臺/g, '台');
                        matchesCounty = (normalizedItemRegion === normalizedCounty) ||
                                        itemAddress.replace(/臺/g, '台').includes(normalizedCounty);
                    }
                    
                    return matchesRegion && matchesCounty;
                });

                // B. 計算分頁
                const totalItems = filteredItems.length;
                const totalPages = Math.ceil(totalItems / PAGE_SIZE);
                
                // 防呆處理：若目前頁數超出總頁數，退回第一頁
                if (currentPage > totalPages && totalPages > 0) {
                    currentPage = 1;
                }

                // C. 隱藏所有景點，僅顯示當前頁面範圍 (12筆)
                attractionItems.forEach(item => item.style.display = 'none');
                
                const startIdx = (currentPage - 1) * PAGE_SIZE;
                const endIdx = Math.min(startIdx + PAGE_SIZE, totalItems);
                
                for (let i = startIdx; i < endIdx; i++) {
                    filteredItems[i].style.display = 'block';
                }

                // D. 渲染分頁按鈕
                renderPaginationButtons(totalPages);
            }

            // 4. 動態繪製分頁按鈕
            function renderPaginationButtons(totalPages) {
                if (totalPages <= 1) {
                    paginationContainer.style.setProperty('display', 'none', 'important');
                    return;
                }
                
                paginationContainer.style.setProperty('display', 'flex', 'important');
                pageInfo.innerText = `頁面 ${currentPage} / ${totalPages}`;
                pageButtons.innerHTML = '';

                // (A) 上一頁按鈕
                const prevBtn = document.createElement('a');
                prevBtn.href = '#attrSection';
                prevBtn.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
                prevBtn.innerText = '‹ 上一頁';
                prevBtn.addEventListener('click', (e) => {
                    if (currentPage > 1) {
                        currentPage--;
                        filterAndPaginate();
                        scrollToSection();
                    } else {
                        e.preventDefault();
                    }
                });
                pageButtons.appendChild(prevBtn);

                // (B) 頁碼按鈕
                for (let i = 1; i <= totalPages; i++) {
                    const pageBtn = document.createElement('a');
                    pageBtn.href = '#attrSection';
                    pageBtn.className = `page-item ${i === currentPage ? 'active' : ''}`;
                    pageBtn.innerText = i;
                    pageBtn.addEventListener('click', () => {
                        currentPage = i;
                        filterAndPaginate();
                        scrollToSection();
                    });
                    pageButtons.appendChild(pageBtn);
                }

                // (C) 下一頁按鈕
                const nextBtn = document.createElement('a');
                nextBtn.href = '#attrSection';
                nextBtn.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
                nextBtn.innerText = '下一頁 ›';
                nextBtn.addEventListener('click', (e) => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        filterAndPaginate();
                        scrollToSection();
                    } else {
                        e.preventDefault();
                    }
                });
                pageButtons.appendChild(nextBtn);
            }

            // 5. 點擊分頁時平滑滾動至推薦區段頂部
            function scrollToSection() {
                if (attrSection) {
                    attrSection.scrollIntoView({ behavior: 'smooth' });
                }
            }
        });


    </script>
</body>

</html>
