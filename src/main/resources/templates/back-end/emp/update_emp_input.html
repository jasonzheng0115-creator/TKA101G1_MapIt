<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>MapIt 後台 - 修改員工資料</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />

    <style>
        :root {
            --primary-orange: #ff5722;
            --primary-orange-hover: #e64a19;
            --dark-blue: #0f172a;
        }

        /* 卡片樣式 */
        .form-card {
            background-color: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .form-card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark-blue);
            border-left: 5px solid var(--primary-orange);
            padding-left: 10px;
            margin-bottom: 2rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
        }

        /* 按鈕樣式 */
        .btn-orange {
            background-color: var(--primary-orange) !important;
            color: white !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
            border: none !important;
            transition: background-color 0.2s;
        }

        .btn-orange:hover {
            background-color: var(--primary-orange-hover) !important;
            color: white !important;
        }

        .btn-outline-orange {
            border: 1.5px solid var(--primary-orange) !important;
            color: var(--primary-orange) !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
            background: transparent !important;
            transition: all 0.2s;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange) !important;
            color: white !important;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.15);
        }

        /* 欄位錯誤提示紅字 */
        .error-text {
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>

<body>

    <!-- 引入共用後台導覽列片段 -->
    <header th:replace="~{layouts/backend :: backendHeader}"></header>

    <!-- 主要內容區 -->
    <div class="container px-4 px-lg-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- 修改員工卡片 -->
                <div class="form-card">
                    <h3><i class="bi bi-pencil-square text-orange"></i> 編輯員工資料 (員工編號: <span
                            th:text="${empVO.empId}">1001</span>)</h3>

                    <!-- 系統錯誤訊息 (如驗證未過例外) -->
                    <div class="alert alert-danger shadow-sm mb-4" role="alert" th:if="${errorMsg}"
                        th:text="${errorMsg}"></div>

                    <!-- 修改表單 -->
                    <form method="post" th:action="@{/emp/update}" th:object="${empVO}" id="empUpdateForm"
                        th:data-original-dept="*{deptVO.deptId}" th:data-original-status="*{empStatus}">
                        <input type="hidden" name="authPwd" id="authPwd">

                        <!-- 帶入員工 ID 主鍵 (隱藏欄位，以利更新定位) -->
                        <input type="hidden" th:field="*{empId}">

                        <div class="row g-4">
                            <!-- 1. 姓名 -->
                            <div class="col-md-6">
                                <label for="empName" class="form-label fw-bold">員工姓名 :</label>
                                <input type="text" class="form-control py-2" id="empName" th:field="*{empName}"
                                    placeholder="請輸入 2-20 字姓名" required th:readonly="${!isSelf}">
                                <span class="error-text" th:if="${#fields.hasErrors('empName')}"
                                    th:errors="*{empName}"></span>
                            </div>

                            <!-- 2. 性別 (Radio) -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold d-block">性別 :</label>
                                <div class="pt-2">
                                    <div class="form-check form-check-inline me-4">
                                        <input class="form-check-input" type="radio" id="sexM" th:field="*{empSex}"
                                            value="M" required th:disabled="${!isSelf}">
                                        <label class="form-check-label fw-bold" for="sexM">男</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" id="sexF" th:field="*{empSex}"
                                            value="F" required th:disabled="${!isSelf}">
                                        <label class="form-check-label fw-bold" for="sexF">女</label>
                                    </div>
                                    <!-- 當唯讀狀態禁用 radio 時，利用隱藏欄位送出原值防止綁定遺失 -->
                                    <input type="hidden" th:if="${!isSelf}" name="empSex" th:value="*{empSex}">
                                </div>
                                <span class="error-text" th:if="${#fields.hasErrors('empSex')}"
                                    th:errors="*{empSex}"></span>
                            </div>

                            <!-- 3. 電話 -->
                            <div class="col-md-6">
                                <label for="empTel" class="form-label fw-bold">聯絡電話 :</label>
                                <input type="text" class="form-control py-2" id="empTel" th:field="*{empTel}"
                                    placeholder="請輸入聯絡電話" required th:readonly="${!isSelf}">
                                <span class="error-text" th:if="${#fields.hasErrors('empTel')}"
                                    th:errors="*{empTel}"></span>
                            </div>

                            <!-- 4. 信箱 -->
                            <div class="col-md-6">
                                <label for="empEmail" class="form-label fw-bold">電子信箱 :</label>
                                <input type="email" class="form-control py-2" id="empEmail" th:field="*{empEmail}"
                                    placeholder="請輸入 Email 信箱" required th:readonly="${!isSelf}">
                                <span class="error-text" th:if="${#fields.hasErrors('empEmail')}"
                                    th:errors="*{empEmail}"></span>
                            </div>

                            <!-- 5. 所屬部門 (Dropdown) -->
                            <div class="col-md-6">
                                <label for="deptId" class="form-label fw-bold">所屬部門 :</label>
                                <select class="form-select py-2" id="deptId" th:field="*{deptVO.deptId}" required>
                                    <option th:each="dept : ${deptList}" th:value="${dept.deptId}"
                                        th:text="${dept.deptId} + ' - ' + ${dept.deptName}">
                                    </option>
                                </select>
                                <span class="error-text" th:if="${#fields.hasErrors('deptVO.deptId')}"
                                    th:errors="*{deptVO.deptId}"></span>
                            </div>

                            <!-- 6. 啟用狀態 (Radio) -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold d-block">啟用狀態 :</label>
                                <div class="pt-2">
                                    <div class="form-check form-check-inline me-4">
                                        <input class="form-check-input" type="radio" id="statusActive"
                                            th:field="*{empStatus}" th:value="true" required>
                                        <label class="form-check-label fw-bold text-success"
                                            for="statusActive">啟用</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" id="statusInactive"
                                            th:field="*{empStatus}" th:value="false" required>
                                        <label class="form-check-label fw-bold text-danger"
                                            for="statusInactive">停用</label>
                                    </div>
                                </div>
                                <span class="error-text" th:if="${#fields.hasErrors('empStatus')}"
                                    th:errors="*{empStatus}"></span>
                            </div>

                            <!-- 7. 帳號 -->
                            <div class="col-md-6">
                                <label for="empAcc" class="form-label fw-bold">登入帳號 :</label>
                                <input type="text" class="form-control py-2" id="empAcc" th:field="*{empAcc}"
                                    placeholder="請輸入 6-12 碼英數帳號" required readonly="readonly">
                                <span class="error-text" th:if="${#fields.hasErrors('empAcc')}"
                                    th:errors="*{empAcc}"></span>
                            </div>

                            <!-- 8. 密碼 -->
                            <!-- 密碼隱藏欄位，用於傳遞/綁定原始密碼或不修改時的原值 -->
                            <input type="hidden" th:field="*{empPwd}">

                            <!-- 修改密碼與重複驗證欄位，僅限修改自己時顯示 -->
                            <th:block th:if="${isSelf}">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="newPwd" class="form-label fw-bold">變更密碼 (若不修改請留空) :</label>
                                        <input type="password" class="form-control py-2" id="newPwd" name="newPwd"
                                            placeholder="請輸入 8-20 碼新密碼" autocomplete="new-password">
                                    </div>
                                    <div>
                                        <label for="confirmPwd" class="form-label fw-bold">確認新密碼 :</label>
                                        <input type="password" class="form-control py-2" id="confirmPwd"
                                            name="confirmPwd" placeholder="請再次輸入新密碼" autocomplete="new-password">
                                    </div>
                                </div>
                            </th:block>

                            <!-- 按鈕操作區區塊 -->
                            <div class="col-md-12 mt-5 d-flex justify-content-end gap-3 border-top pt-4">
                                <a th:href="@{/emp/listAllEmp}" class="btn btn-outline-orange px-4 py-2">取消返回</a>
                                <button type="submit" class="btn btn-orange px-5 py-2">儲存修改 💾</button>
                            </div>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- 前端防護與授權對話框 JS 邏輯 -->
    <script>
        document.getElementById('empUpdateForm').addEventListener('submit', function (event) {
            const form = this;
            const originalDept = form.getAttribute('data-original-dept');
            const originalStatus = form.getAttribute('data-original-status');

            // 1. 取得目前選取的部門與啟用狀態
            const currentDept = document.getElementById('deptId').value;
            const currentStatusInput = document.querySelector('input[name="empStatus"]:checked');
            const currentStatus = currentStatusInput ? currentStatusInput.value : '';

            // 2. 比對是否有所變更
            const deptChanged = String(originalDept) !== String(currentDept);
            const statusChanged = String(originalStatus) !== String(currentStatus);

            if (deptChanged || statusChanged) {
                const password = prompt("偵測到您變更了「所屬部門」或「啟用狀態」，請輸入安全授權密碼以儲存：");

                if (password === null) {
                    // 使用者點選取消
                    event.preventDefault();
                    return;
                }

                if (password.trim() === "") {
                    alert("安全授權密碼不能為空，儲存失敗！");
                    event.preventDefault();
                    return;
                }

                if (password !== "root888") {
                    alert("安全授權密碼錯誤，儲存失敗！");
                    event.preventDefault();
                    return;
                }

                // 將正確的密碼寫入隱藏欄位隨表單送出
                document.getElementById('authPwd').value = password;
            }

            // 3. 自我密碼修改驗證
            const newPwdInput = document.getElementById('newPwd');
            const confirmPwdInput = document.getElementById('confirmPwd');
            if (newPwdInput && confirmPwdInput) {
                const newPwd = newPwdInput.value;
                const confirmPwd = confirmPwdInput.value;

                if (newPwd.trim() !== "") {
                    if (newPwd !== confirmPwd) {
                        alert("兩次輸入的新密碼不一致！");
                        event.preventDefault();
                        return;
                    }
                    if (newPwd.length < 8 || newPwd.length > 20) {
                        alert("新密碼長度需在 8-20 碼之間！");
                        event.preventDefault();
                        return;
                    }
                }
            }
        });

        // 點擊或修改欄位時自動清除該欄位的錯誤提示
        document.querySelectorAll('form input, form select').forEach(element => {
            const clearError = () => {
                const container = element.closest('div[class^="col-md-"]');
                if (container) {
                    const errorSpan = container.querySelector('.error-text');
                    if (errorSpan) {
                        errorSpan.textContent = '';
                    }
                }
            };
            element.addEventListener('focus', clearError);
            element.addEventListener('change', clearError);
            element.addEventListener('input', clearError);
        });
    </script>
</body>

</html>
