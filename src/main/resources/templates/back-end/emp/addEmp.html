<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>MapIt 後台 - 新增員工</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />

    <style>
        :root {
            --primary-orange: #ff5722;
            --primary-orange-hover: #e64a19;
            --dark-blue: #0f172a;
        }

        /* 卡片樣式 */
        .form-card {
            background-color: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .form-card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark-blue);
            border-left: 5px solid var(--primary-orange);
            padding-left: 10px;
            margin-bottom: 2rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
        }

        /* 按鈕樣式 */
        .btn-orange {
            background-color: var(--primary-orange) !important;
            color: white !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
            border: none !important;
            transition: background-color 0.2s;
        }

        .btn-orange:hover {
            background-color: var(--primary-orange-hover) !important;
            color: white !important;
        }

        .btn-outline-orange {
            border: 1.5px solid var(--primary-orange) !important;
            color: var(--primary-orange) !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
            background: transparent !important;
            transition: all 0.2s;
        }

        .btn-outline-orange:hover {
            background-color: var(--primary-orange) !important;
            color: white !important;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.15);
        }

        /* 欄位錯誤提示紅字 */
        .error-text {
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>

<body>

    <!-- 引入共用後台導覽列片段 -->
    <header th:replace="~{layouts/backend :: backendHeader}"></header>

    <!-- 主要內容區 -->
    <div class="container px-4 px-lg-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- 新增員工卡片 -->
                <div class="form-card">
                    <h3><i class="bi bi-person-plus-fill text-orange"></i> 填寫新增員工資料</h3>

                    <!-- 系統錯誤訊息 (如帳號重複例外) -->
                    <div class="alert alert-danger shadow-sm mb-4" role="alert" th:if="${errorMsg}"
                        th:text="${errorMsg}"></div>

                    <!-- 新增表單 -->
                    <form method="post" th:action="@{/emp/addEmp}" th:object="${empVO}">

                        <!-- 預設啟用狀態為 true (隱藏欄位) -->
                        <input type="hidden" th:field="*{empStatus}">

                        <div class="row g-4">
                            <!-- 1. 姓名 -->
                            <div class="col-md-6">
                                <label for="empName" class="form-label fw-bold">員工姓名 :</label>
                                <input type="text" class="form-control py-2" id="empName" th:field="*{empName}"
                                    placeholder="請輸入 2-20 字中英文姓名" required>
                                <span class="error-text" th:if="${#fields.hasErrors('empName')}"
                                    th:errors="*{empName}"></span>
                            </div>

                            <!-- 2. 性別 (Radio) -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold d-block">性別 :</label>
                                <div class="pt-2">
                                    <div class="form-check form-check-inline me-4">
                                        <input class="form-check-input" type="radio" id="sexM" th:field="*{empSex}"
                                            value="M" required>
                                        <label class="form-check-label fw-bold" for="sexM">男</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" id="sexF" th:field="*{empSex}"
                                            value="F" required>
                                        <label class="form-check-label fw-bold" for="sexF">女</label>
                                    </div>
                                </div>
                                <span class="error-text" th:if="${#fields.hasErrors('empSex')}"
                                    th:errors="*{empSex}"></span>
                            </div>

                            <!-- 3. 電話 -->
                            <div class="col-md-6">
                                <label for="empTel" class="form-label fw-bold">聯絡電話 :</label>
                                <input type="text" class="form-control py-2" id="empTel" th:field="*{empTel}"
                                    placeholder="請輸入聯絡電話" required>
                                <span class="error-text" th:if="${#fields.hasErrors('empTel')}"
                                    th:errors="*{empTel}"></span>
                            </div>

                            <!-- 4. 信箱 -->
                            <div class="col-md-6">
                                <label for="empEmail" class="form-label fw-bold">電子信箱 :</label>
                                <input type="email" class="form-control py-2" id="empEmail" th:field="*{empEmail}"
                                    placeholder="請輸入 Email 信箱" required>
                                <span class="error-text" th:if="${#fields.hasErrors('empEmail')}"
                                    th:errors="*{empEmail}"></span>
                            </div>

                            <!-- 5. 所屬部門 (Dropdown) -->
                            <div class="col-md-12">
                                <label for="deptId" class="form-label fw-bold">所屬部門 :</label>
                                <select class="form-select py-2" id="deptId" th:field="*{deptVO.deptId}" required>
                                    <option value="">-- 請選擇所屬部門 --</option>
                                    <option th:each="dept : ${deptList}" th:value="${dept.deptId}"
                                        th:text="${dept.deptId} + ' - ' + ${dept.deptName}">
                                    </option>
                                </select>
                                <span class="error-text" th:if="${#fields.hasErrors('deptVO')}"
                                    th:errors="*{deptVO}"></span>
                            </div>

                            <!-- 6. 帳號 -->
                            <div class="col-md-6">
                                <label for="empAcc" class="form-label fw-bold">登入帳號 :</label>
                                <input type="text" class="form-control py-2" id="empAcc" th:field="*{empAcc}"
                                    placeholder="請輸入 6-12 碼英數帳號" required>
                                <span class="error-text" th:if="${#fields.hasErrors('empAcc')}"
                                    th:errors="*{empAcc}"></span>
                            </div>

                            <!-- 7. 密碼 -->
                            <div class="col-md-6">
                                <label for="empPwd" class="form-label fw-bold">登入密碼 :</label>
                                <input type="password" class="form-control py-2" id="empPwd" th:field="*{empPwd}"
                                    placeholder="請輸入 8-20 碼英數密碼" required autocomplete="new-password">
                                <span class="error-text" th:if="${#fields.hasErrors('empPwd')}"
                                    th:errors="*{empPwd}"></span>
                            </div>

                            <!-- 按鈕操作區 -->
                            <div class="col-md-12 mt-5 d-flex justify-content-end gap-3 border-top pt-4">
                                <button type="button" onclick="clearForm()"
                                    class="btn btn-light px-4 py-2 fw-bold text-secondary border">重設欄位</button>
                                <a th:href="@{/emp/listAllEmp}" class="btn btn-outline-orange px-4 py-2">取消返回</a>
                                <button type="submit" class="btn btn-orange px-5 py-2">確認新增 🚀</button>
                            </div>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript 自訂清空與錯誤訊息動態清除邏輯 -->
    <script>
        function clearForm() {
            const form = document.querySelector('form');
            if (form) {
                // 1. 清空所有文字、信箱、密碼、電話輸入框
                form.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]').forEach(input => {
                    input.value = '';
                });
                // 2. 取消選取性別 Radio 按鈕
                form.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.checked = false;
                });
                // 3. 重置部門下拉選單至第一個選項 ("-- 請選擇所屬部門 --")
                form.querySelectorAll('select').forEach(select => {
                    select.selectedIndex = 0;
                });
                // 4. 清除頁面上顯示的所有後端驗證紅色錯誤訊息
                form.querySelectorAll('.error-text').forEach(span => {
                    span.textContent = '';
                });
                // 5. 清除全域系統錯誤提示 (例如帳號已存在錯誤)
                const globalAlert = document.querySelector('.alert.alert-danger');
                if (globalAlert) {
                    globalAlert.style.display = 'none';
                }
            }
        }

        // 點擊或修改欄位時自動清除該欄位的錯誤提示
        document.querySelectorAll('form input, form select').forEach(element => {
            const clearError = () => {
                const container = element.closest('div[class^="col-md-"]');
                if (container) {
                    const errorSpan = container.querySelector('.error-text');
                    if (errorSpan) {
                        errorSpan.textContent = '';
                    }
                }
            };
            element.addEventListener('focus', clearError);
            element.addEventListener('change', clearError);
            element.addEventListener('input', clearError);
        });
    </script>
</body>

</html>
